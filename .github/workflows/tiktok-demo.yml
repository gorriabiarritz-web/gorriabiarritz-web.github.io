{"name":"TikTok demo - envoi d'un brouillon (Sandbox)","on":{"workflow_dispatch":{"inputs":{"code":{"description":"Code d'autorisation affiche sur la page de connexion","required":true}}}},"jobs":{"envoi":{"runs-on":"ubuntu-latest","steps":[{"name":"Envoyer un brouillon de test","env":{"CK":"sbawy0uimqrabxu9o6","CS":"${{ secrets.TIKTOK_SANDBOX_CLIENT_SECRET }}","CODE":"${{ github.event.inputs.code }}","RU":"https://gorriabiarritz-web.github.io/callback.html"},"run":"set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y -qq ffmpeg jq\nffmpeg -y -loglevel error -f lavfi -i testsrc=size=720x1280:rate=30 -f lavfi -i sine=frequency=440 -t 6 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest demo.mp4\nRESP=$(curl -s -X POST https://open.tiktokapis.com/v2/oauth/token/ -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode client_key=\"$CK\" --data-urlencode client_secret=\"$CS\" --data-urlencode code=\"$CODE\" --data-urlencode grant_type=authorization_code --data-urlencode redirect_uri=\"$RU\")\nTOKEN=$(echo \"$RESP\" | jq -r '.access_token // empty')\nif [ -z \"$TOKEN\" ]; then echo \"Erreur OAuth (details masques):\"; echo \"$RESP\" | jq 'del(.access_token,.refresh_token)'; exit 1; fi\necho \"::add-mask::$TOKEN\"\necho \"Connexion TikTok OK. Portee accordee: $(echo \"$RESP\" | jq -r .scope)\"\nSIZE=$(stat -c%s demo.mp4)\nBODY=$(jq -n --argjson s \"$SIZE\" '{source_info:{source:\"FILE_UPLOAD\",video_size:$s,chunk_size:$s,total_chunk_count:1}}')\nINIT=$(curl -s -X POST https://open.tiktokapis.com/v2/post/publish/inbox/video/init/ -H \"Authorization: Bearer $TOKEN\" -H 'Content-Type: application/json; charset=UTF-8' -d \"$BODY\")\necho \"$INIT\" | jq 'del(.data.upload_url)'\nURL=$(echo \"$INIT\" | jq -r '.data.upload_url // empty')\nPID=$(echo \"$INIT\" | jq -r '.data.publish_id // empty')\nif [ -z \"$URL\" ]; then echo \"Init refuse\"; exit 1; fi\ncurl -s -o /dev/null -w \"Upload HTTP %{http_code}\\n\" -X PUT \"$URL\" -H \"Content-Type: video/mp4\" -H \"Content-Range: bytes 0-$((SIZE-1))/$SIZE\" --upload-file demo.mp4\necho \"Brouillon envoye: publish_id=$PID\"\nSBODY=$(jq -n --arg p \"$PID\" '{publish_id:$p}')\nfor i in 1 2 3 4 5 6; do sleep 5; curl -s -X POST https://open.tiktokapis.com/v2/post/publish/status/fetch/ -H \"Authorization: Bearer $TOKEN\" -H 'Content-Type: application/json; charset=UTF-8' -d \"$SBODY\" | jq -c .; done\n"}]}}}
